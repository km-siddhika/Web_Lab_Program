<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Design Tokens Demo</title>
<style>
:root{--color-ink:#243047;--color-muted:#64748b;--color-brand:#315b91;--color-surface:#fff;--color-page:#f3f6fb;--font-body:Arial,sans-serif;--text-small:.875rem;--text-large:1.25rem;--heading-xl:clamp(2rem,5vw,3.5rem);--space-1:.5rem;--space-2:1rem;--space-3:1.5rem;--space-4:2rem;--radius-card:.75rem}
*{box-sizing:border-box}body{margin:0;padding:var(--space-4);font-family:var(--font-body);color:var(--color-ink);background:var(--color-page)}
.sample{max-width:720px;margin:8vh auto;padding:var(--space-4);background:var(--color-surface);border-radius:var(--radius-card)}
h1{max-width:600px;font-size:var(--heading-xl);line-height:1.1}p{color:var(--color-muted);font-size:var(--text-large)}.label{color:var(--color-brand);font-size:var(--text-small);font-weight:bold;letter-spacing:.12em}a{color:var(--color-brand)}
</style></head>
<body><main class="sample"><p class="label">DESIGN SYSTEM</p><h1>One set of styles, used consistently.</h1><p>CSS custom properties make colours, spacing and typography easier to maintain.</p><a href="#">Sample link</a></main></body></html>
